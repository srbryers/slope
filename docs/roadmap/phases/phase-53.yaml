        complexity: moderate
        github_issue: 590
        depends_on:
          - S234-1
      - key: S234-3
        title: Add explicit include and exclude path filters for bounded review scope (#590)
        club: short_iron
        complexity: standard
        github_issue: 590
        depends_on:
          - S234-2
      - key: S234-4
        title: Cover oversized diffs, filtered prompts, and provider-truncation messaging (#590)
        club: wedge
        complexity: small
        github_issue: 590
        depends_on:
          - S234-3

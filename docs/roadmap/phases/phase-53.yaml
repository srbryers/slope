    par: 4
    slope: 3
    type: feature + review reliability
    status: planned
    depends_on:
      - 232
    note: "Fix #590 by separating lookup failures from bounded diff retrieval and provider truncation."
    tickets:
      - key: S234-1
        title: Classify gh lookup, authentication, timeout, exit, and buffer failures with bounded diagnostics (#590)
        club: long_iron
        complexity: moderate
        github_issue: 590
      - key: S234-2
        title: Retrieve large PR metadata and diffs without the prior exec buffer ceiling (#590)

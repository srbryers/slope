version: "1"
phase:
  name: Phase 53 — Post-Federation Adoption Hardening
  description: Close the first real-project gaps exposed after v1.61.0 by making roadmap federation cross-platform, large reviews bounded and diagnosable, and monolith migration transactional.
  sprints:
    - 233
    - 234
    - 235
    - 236
  status: active
  note: "Issue-driven recovery for #591, #590, and #589. Prioritize the Windows federation unblocker, then review scale, then migration planning/apply safety."

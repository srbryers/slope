        complexity: moderate
        github_issue: 589
        depends_on:
          - S235-1
      - key: S235-3
        title: Require explicit ownership mappings for ambiguous repairs and audit bounded normalizations (#589)
        club: long_iron
        complexity: moderate
        github_issue: 589
        depends_on:
          - S235-2
      - key: S235-4
        title: Prove deterministic idempotent migration plans with bounded diagnostics (#589)

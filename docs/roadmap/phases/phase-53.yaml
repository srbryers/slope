    par: 4
    slope: 2
    type: bugfix + cross-platform compatibility
    status: active
    depends_on:
      - 232
    note: "Fix #591 without weakening semantic projection-drift detection."
    tickets:
      - key: S233-1
        title: Define checkout-EOL-safe projection comparison without hiding semantic drift (#591)
        club: long_iron
        complexity: moderate
        github_issue: 591
      - key: S233-2
        title: Normalize generated projection bytes at the comparison and write boundary across CRLF checkouts (#591)
        club: short_iron
        complexity: standard
        github_issue: 591
        depends_on:
          - S233-1
      - key: S233-3
        title: Add Windows autocrlf and true semantic-drift regression fixtures (#591)
        club: wedge
        complexity: small
        github_issue: 591
        depends_on:
          - S233-2

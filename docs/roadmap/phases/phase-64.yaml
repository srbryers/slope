version: "1"
phase:
  name: Phase 64 — Team Round Collaboration Runtime
  description: "Implement the SLOPE Team Round contracts specified in S264-S264.2 after canonical sprint IDs ship in S267. The runtime evolves the existing event store into a shared coordination ledger, keeps one authoritative team score with actor-attributed evidence, and makes access control, fenced leases, typed resources, attribution, learning, workflow, status, and evaluation first-class."
  sprints:
    - 268
    - "268.1"
    - "268.2"
    - "268.3"
    - "268.4"
    - "268.5"
    - 269
    - 270
    - 271
    - 272
  status: planned
  note: "Adopt the durable orchestration semantics observed in block/buzz without copying its Nostr transport, cryptographic identity, or chat-first product surface. SLOPE remains repository-native and keeps hard worktree, store, and claim enforcement. Phase 64 follows the 2.0 sprint-id migration so every coordination record starts with canonical identity and the complete access envelope."
sprints:
  - id: 268
    theme: Ledger Substrate And Trust Bootstrap
    par: 5
    slope: 4
    type: major + coordination infrastructure
    depends_on:
      - 264
      - 264.1
      - 264.2
      - 267
    note: "Rescoped from the original S268 after architect, backend and security review. The original put capabilities and visibility last, but every envelope carries an authorization and a visibility decision inside its own event hash, so the substrate is a prerequisite of the first append rather than a successor to it. This sprint delivers only what must exist before a single canonical byte is written, and takes no migration and no cutover. depends_on gained 264 and 264.1 because roadmap focus draws hazards from direct dependencies only, and their 40 findings are exactly this subject."
    research:
      - docs/research/buzz-multiplayer-collaboration.md
    tickets:
      - key: S268-1
        title: Project identity and the operator-confirmed trust bootstrap ceremony
        club: driver
        complexity: risky
        github_issue: 669
      - key: S268-2
        title: "Policy registry: identity, capability, visibility, and resource revisions with deny-by-default evaluation"
        club: driver
        complexity: risky
        github_issue: 669
        depends_on:
          - S268-1
      - key: S268-3
        title: Canonical envelope v1 types, validator, and canonical request hash
        club: driver
        complexity: risky
        github_issue: 669
        depends_on:
          - S268-2
      - key: S268-4
        title: Integrity chain functions and HMAC commitments for restricted content
        club: long_iron
        complexity: moderate
        github_issue: 669
        depends_on:
          - S268-3
      - key: S268-5
        title: Secret ingress scanner on every caller-controlled field before hashing or append
        club: long_iron
        complexity: moderate
        github_issue: 669
        depends_on:
          - S268-3
      - key: S268-6
        title: Published cross-adapter golden vectors checked against an independent implementation
        club: short_iron
        complexity: standard
        github_issue: 669
        depends_on:
          - S268-4
          - S268-5
  - id: "268.1"
    theme: Ledger Migration Machine
    par: 5
    slope: 5
    type: major + migration infrastructure
    status: planned
    depends_on:
      - "268"
    note: "Fence conformance suite first, then the SQLite and PostgreSQL fences, the durable resumable phase state machine, inventory, the deterministic import planner and total order, expand, backfill, quarantine, verify, signed manifest, and rollback. Cutover-capable but does not cut over. Split from the original S268 after review found the fence sequenced behind the schema change it protects. Depends on the deployment-profile amendment: SQLite reports an advisory barrier and PostgreSQL requires a non-superuser application role."
    tickets:
      - key: S268.1-1
        title: Publish the fence conformance suite before either implementation exists
        club: long_iron
        complexity: moderate
      - key: S268.1-2
        title: Implement the SQLite advisory fence and the PostgreSQL enforced fence against that suite
        club: driver
        complexity: risky
      - key: S268.1-3
        title: Durable resumable phase machine with signed manifest and rollback
        club: driver
        complexity: risky
      - key: S268.1-4
        title: Deterministic import planner, total order, backfill, and quarantine
        club: driver
        complexity: risky
      - key: S268.1-5
        title: Expand schema and project-scoped composite keys on both backends
        club: driver
        complexity: risky
  - id: "268.2"
    theme: Canonical Append And Cutover
    par: 5
    slope: 5
    type: major + coordination infrastructure
    status: planned
    depends_on:
      - "268.1"
    note: "The append transaction per adapter behind one narrow interface, idempotency identity and canonical request hash, retry and payload-conflict outcomes, ordering, the error taxonomy, the adapter conformance suite, protocol descriptor negotiation, authority generation, cutover, and legacy compatibility mode. Authentication resolves before the transaction opens, because better-sqlite3 transactions cannot await; the transaction re-checks the identity revision under the lock it already holds."
    tickets:
      - key: S268.2-1
        title: Narrow ledger interface and the append transaction on both adapters
        club: driver
        complexity: risky
      - key: S268.2-2
        title: Idempotency identity, canonical request hash, retry and conflict outcomes
        club: driver
        complexity: risky
      - key: S268.2-3
        title: Protocol descriptor negotiation, authority generation, and fail-closed resolution
        club: long_iron
        complexity: moderate
      - key: S268.2-4
        title: Cutover and legacy compatibility mode across every mutable writer
        club: driver
        complexity: risky
  - id: "268.3"
    theme: Projection Replay And Finalization
    par: 5
    slope: 4
    type: major + coordination infrastructure
    status: planned
    depends_on:

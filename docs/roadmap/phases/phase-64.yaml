    note: "Compound envelope, the cycle-free digest DAG, replayable authorization set, event_aggregate_link, per-affected-aggregate chain positions, singular-to-primary equivalence, version 1 to 2 replay, and the golden vector and substitution corpus. OPEN QUESTION carried from architect review: every aggregate a compound event serves belongs to S270, S271 or S272, so this may belong later in the phase. Decide before starting."
    tickets:

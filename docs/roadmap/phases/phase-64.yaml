    note: "Projection substrate and cursors, draft and published scorecard projection, replay from genesis reproducing byte-identical content hashes on both backends, exactly-once finalization, late evidence, and audited reopen with an enforced correction scope and the reclose delta. Includes the roadmap reconciliation reopen requires, which the original plan omitted."

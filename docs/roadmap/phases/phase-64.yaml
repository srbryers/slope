        club: driver
        complexity: risky
      - key: S268.3-4
        title: Exactly-once finalization, late evidence, and recovery
        club: driver
        complexity: risky
      - key: S268.3-5
        title: Audited reopen with enforced correction scope, reclose delta, and roadmap reconciliation
        club: driver
        complexity: risky
  - id: "268.4"
    theme: Compound Version 2 Envelopes
    par: 4

        title: Filtered projections and non-enumeration across cursor, count, error, and cache
        club: driver
        complexity: risky
      - key: S268.5-2
        title: Cursor AEAD and the nonce service under the managed profile
        club: driver
        complexity: risky
      - key: S268.5-3
        title: Redaction state machine and sealed payload destruction without rewriting the chain
        club: driver
        complexity: risky
      - key: S268.5-4
        title: Retention deadlines, expiry filtering, and the backup and restore activation gate
        club: driver
        complexity: risky
      - key: S268.5-5
        title: Adversarial corpus for the disclosure and redaction criteria on both backends
        club: driver
        complexity: risky
  - id: 269
    theme: Fenced Leases and Shared Resources
    par: 4
    slope: 5
    type: major + concurrency control
    depends_on:
      - "268.5"
    note: "Retargeted from 268 to 268.5 when S268 split into six. Leases need the append transaction, the fencing substrate, and the filtered-view rules, so depending on the first of the six would have let this start against a ledger that could not yet append. Make claims recoverable without permitting stale writers. Acquire and renew use authoritative store time and monotonic lease epochs; every mutation presents a fencing token. Ticket, area, port, database, and service claims share one typed overlap model with fair queueing and durable recovery."
    research:
      - docs/research/buzz-multiplayer-collaboration.md
    tickets:
      - key: S269-1
        title: Implement transactional lease acquire and renew with authoritative time, monotonic epochs, fencing tokens, expiry grace, and stale-token rejection
        club: driver
        complexity: risky
        github_issue: 669
      - key: S269-2
        title: Serialize execution per ticket or overlapping area while allowing fair parallel execution for non-overlapping claims
        club: driver
        complexity: risky
        github_issue: 669
        depends_on:
          - S269-1
      - key: S269-3
        title: Add typed claims for ports, local databases, and service instances with explicit project-owned configuration boundaries
        club: long_iron
        complexity: moderate
        github_issue: 669
        depends_on:
          - S269-1
          - S269-2
      - key: S269-4
        title: Add abandonment cleanup, retry, requeue, dead-letter, escalation, and cross-worktree SQLite and PostgreSQL recovery tests
        club: driver

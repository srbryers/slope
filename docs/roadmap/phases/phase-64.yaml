        club: long_iron
        complexity: moderate
  - id: "268.5"
    theme: Filtered Views Redaction And Retention
    par: 5
    slope: 5
    type: major + security
    status: planned
    depends_on:
      - "268.4"
    note: "Filtered views and non-enumeration, cursor AEAD and the nonce service, the redaction state machine, retention deadlines assigned at append, the backup and restore activation gate, export, and the adversarial corpus. Scoped by the deployment-profile amendment: sealed payloads, cursor encryption and cryptographic deletion require the managed_multi_writer profile, and a local SQLite store reports redaction_retention false and fails those operations closed."
    tickets:

version: "1"
phase:
  name: Phase 64 — Team Round Collaboration Runtime
  description: "Implement the SLOPE Team Round contracts specified in S264-S264.2 after canonical sprint IDs ship in S267. The runtime evolves the existing event store into a shared coordination ledger, keeps one authoritative team score with actor-attributed evidence, and makes access control, fenced leases, typed resources, attribution, learning, workflow, status, and evaluation first-class."
  sprints:
    - 268
    - 269
    - 270
    - 271
    - 272
  status: planned
  note: "Adopt the durable orchestration semantics observed in block/buzz without copying its Nostr transport, cryptographic identity, or chat-first product surface. SLOPE remains repository-native and keeps hard worktree, store, and claim enforcement. Phase 64 follows the 2.0 sprint-id migration so every coordination record starts with canonical identity and the complete access envelope."
sprints:
  - id: 268
    theme: Coordination Ledger and Access Control
    par: 4
    slope: 5
    type: major + coordination infrastructure
    depends_on:
      - 264.2
      - 267
    note: "Evolve the existing event store into the authoritative coordination ledger rather than create a parallel source of truth. The first schema includes the minimum canonical scorecard identity and version fields plus complete event identity and access scope, rejects idempotency conflicts, projects scorecard and status atomically, replays deterministically, and enforces capabilities and redaction in the store. S270 extends attribution and estimator projections without introducing fields that S268 finalization already hashes."
    research:
      - docs/research/buzz-multiplayer-collaboration.md
    tickets:
      - key: S268-1
        title: Migrate the existing event store to a versioned coordination envelope and minimum canonical scorecard schema with project, round, attempt, scorecard, shot, penalty, loss-component, actor, session, role, contributor, verifier, authority, visibility, correlation, and causation identity
        club: driver
        complexity: risky
        github_issue: 669
      - key: S268-2
        title: Implement scoped idempotency keys, payload-conflict rejection, atomic append and projection, ordering, and schema evolution
        club: driver
        complexity: risky
        github_issue: 669
        depends_on:
          - S268-1
      - key: S268-3
        title: Implement deterministic draft and published scorecard projection, replay, and exactly-once Team Round finalization with explicit late-event and audited-reopen behavior
        club: driver
        complexity: risky
        github_issue: 669
        depends_on:
          - S268-1
          - S268-2
      - key: S268-4
        title: Enforce deny-by-default capabilities, principal binding, filtered projections, redaction, retention, and adversarial bypass tests
        club: driver
        complexity: risky
        github_issue: 669
        depends_on:
          - S268-1
          - S268-2
  - id: 269
    theme: Fenced Leases and Shared Resources
    par: 4
    slope: 5
    type: major + concurrency control
    depends_on:
      - 268
    note: "Make claims recoverable without permitting stale writers. Acquire and renew use authoritative store time and monotonic lease epochs; every mutation presents a fencing token. Ticket, area, port, database, and service claims share one typed overlap model with fair queueing and durable recovery."
    research:
      - docs/research/buzz-multiplayer-collaboration.md
    tickets:
      - key: S269-1
        title: Implement transactional lease acquire and renew with authoritative time, monotonic epochs, fencing tokens, expiry grace, and stale-token rejection
        club: driver
        complexity: risky
        github_issue: 669
      - key: S269-2
        title: Serialize execution per ticket or overlapping area while allowing fair parallel execution for non-overlapping claims
        club: driver
        complexity: risky
        github_issue: 669
        depends_on:
          - S269-1
      - key: S269-3
        title: Add typed claims for ports, local databases, and service instances with explicit project-owned configuration boundaries
        club: long_iron
        complexity: moderate
        github_issue: 669
        depends_on:
          - S269-1
          - S269-2
      - key: S269-4
        title: Add abandonment cleanup, retry, requeue, dead-letter, escalation, and cross-worktree SQLite and PostgreSQL recovery tests
        club: driver
        complexity: risky
        github_issue: 669
        depends_on:
          - S269-1
          - S269-2
          - S269-3
  - id: 270
    theme: Team Round Attribution and Learning
    par: 4
    slope: 5
    type: major + scoring model
    depends_on:
      - 269
    note: "Preserve one canonical score-versus-par result while making individual contribution measurable. Actor and role metrics are risk-adjusted descriptive estimates with explicit exposure and uncertainty; coordination overhead is reported separately; penalties and learning updates use stable identity so they cannot be double-counted or lost."
    research:
      - docs/research/buzz-multiplayer-collaboration.md
    tickets:
      - key: S270-1
        title: Implement accountable actor, contributor, verifier, ownership-spell, and participant attribution projections on the canonical S268 scorecard schema
        club: driver
        complexity: risky
        github_issue: 669
      - key: S270-2
        title: Implement risk-adjusted descriptive actor and role handicaps with difficulty, exposure, aggregation window, minimum sample, and uncertainty
        club: driver
        complexity: risky
        github_issue: 669
        depends_on:
          - S270-1
      - key: S270-3
        title: Implement typed missingness, missing reason, provenance, sample count, coverage, and reliability without coercing unknown to zero
        club: long_iron
        complexity: moderate
        github_issue: 669
        depends_on:
          - S270-1
          - S270-2
      - key: S270-4
        title: Implement penalty causation, normalized allocation, non-additive participant diagnostics, and append-only or transactional merge-safe common-issues learning on canonical S268 penalty identity
        club: driver
        complexity: risky
        github_issue: 669
        depends_on:
          - S270-1
          - S270-2
          - S270-3
  - id: 271
    theme: Multiplayer Workflow and Status
    par: 4
    slope: 4
    type: major + operating surface
    depends_on:
      - 270
    note: "Make collaboration legible and accountable. Assignments carry success criteria and mandatory callbacks, verifier independence follows authenticated principal relationships rather than labels, and status presents meaningful activity and failure while respecting filtered visibility."
    research:
      - docs/research/buzz-multiplayer-collaboration.md
    tickets:
      - key: S271-1
        title: Add assignment and handoff states with delegator, assignee, success criteria, correlation, and completion or blocker callbacks
        club: long_iron
        complexity: moderate
        github_issue: 669
      - key: S271-2
        title: Enforce verifier independence across authors, contributors, delegators, sessions, aliases, and authenticated principals
        club: driver
        complexity: risky
        github_issue: 669
        depends_on:
          - S271-1
      - key: S271-3
        title: Build a semantic verb-object-outcome feed with prominent blocker, failure, idle, stale, and timeout states
        club: long_iron
        complexity: moderate
        github_issue: 669
        depends_on:
          - S271-1
      - key: S271-4
        title: Add controller, contributor, requester, and observer operating views backed by filtered ledger projections
        club: long_iron
        complexity: moderate
        github_issue: 669
        depends_on:
          - S271-2
          - S271-3
  - id: 272
    theme: Multiplayer Benchmark Evaluation
    par: 4
    slope: 4
    type: major + evaluation
    depends_on:
      - 271
    note: "Evaluate team and single-agent execution reproducibly without leaking secrets or overclaiming causality. Manifests pin code, tasks, actors, models, harness, evaluator, environment, topology, prompts and skills by hash, generation and lifecycle settings, seeds and trials, budgets, prices, and raw evidence hashes."
    research:
      - docs/research/buzz-multiplayer-collaboration.md
    tickets:
      - key: S272-1
        title: Add a benchmark manifest pinning task corpus, base commit, roster, models, harness, evaluator, environment, topology, prompts, skills, settings, seeds, and trials
        club: driver
        complexity: risky
        github_issue: 669
      - key: S272-2
        title: Pin timeout, retry, budget, and price policy plus content-addressed evidence with secret and PII redaction and retention rules
        club: long_iron
        complexity: moderate
        github_issue: 669
        depends_on:
          - S272-1
      - key: S272-3
        title: Compare canonical reward, cost, elapsed time, and separately reported coordination overhead across team and single-agent trials
        club: long_iron
        complexity: moderate
        github_issue: 669
        depends_on:
          - S272-1
          - S272-2
      - key: S272-4
        title: Report sample size, coverage, uncertainty, missingness, reliability, and non-causal interpretation with reproducibility checks
        club: short_iron
        complexity: standard
        github_issue: 669
        depends_on:
          - S272-2
          - S272-3

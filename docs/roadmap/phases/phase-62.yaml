version: "1"
phase:
  name: Phase 62 — Parallel Agent Coordination Recovery
  description: "Triage of the late-July multi-agent and status-surface issue batch (#663, #664, #665, #666, #667, #668, #669). The triage pass runs first so the roadmap records the open-issue ordering before implementation begins. Worktree store split-brain leads because it silently disables the coordination primitives and sprint guards in the path the collision guard mandates. Session/status truth comes next, then workflow execution scoping, then the product decision for what a multi-agent round means."
  sprints:
    - 260
    - 261
    - 262
    - 263
    - 264
  status: in_progress
  note: "Issue-driven recovery for #663-#669. Ordered by blast radius: S260 records the triage, #665/#667 make worktree sessions guard-blind and claim-blind, #666/#663/#664 make the status surface misleading for operators and agents, #668 gates fresh work on stale executions, and #669 is a deliberate product-model decision that should be made after the plumbing stops lying."
sprints:
  - id: 260
    status: complete
    theme: Late-July Issue Triage
    par: 3
    slope: 2
    type: planning + roadmap triage
    note: "Pull the latest upstream state, enumerate the open issue set, sort by blast radius and release risk, and commit the roadmap update before implementation starts."
    tickets:
      - key: S260-1
        title: Pull and rebuild latest main, then enumerate open GitHub issues #659 and #663-#669
        club: wedge
        complexity: small
      - key: S260-2
        title: Triage #665-#669 into ordered parallel-agent coordination recovery sprints
        club: short_iron
        complexity: standard
        depends_on:
          - S260-1
      - key: S260-3
        title: Isolate #659 into a 2.0 canonical sprint-id store migration track
        club: short_iron
        complexity: standard
        depends_on:
          - S260-1
      - key: S260-4
        title: Validate modular roadmap sources, compiled projection, codebase map, and S260 focus
        club: wedge
        complexity: small
        depends_on:
          - S260-2
          - S260-3
  - id: 261
    theme: Worktree Store Coordination
    par: 5
    slope: 5
    type: bugfix + multi-agent coordination
    depends_on:
      - 260
    note: "Fix #665/#667: the collision guard tells agents to enter a worktree, but a fresh worktree creates an isolated .slope store while MCP and parent sessions keep using the original store. That split-brain silently drops sprint-workflow guards, duplicates sprint state, and makes acquire_claim/check_conflicts return success with zero visible claims."
    tickets:
      - key: S261-1
        title: Resolve SLOPE state from the git common-dir owner so repo worktrees share one store (#665/#667)
        club: driver
        complexity: risky
        github_issue: 667
      - key: S261-2
        title: Make hook briefing, guard baselines, session state, and MCP tools agree on the same store path inside worktrees (#665)
        club: driver
        complexity: risky
        github_issue: 665
        depends_on:
          - S261-1
      - key: S261-3
        title: Warn or refuse when an in-repo child worktree would be globbed by parent tooling (#667)
        club: short_iron
        complexity: standard
        github_issue: 667
        depends_on:
          - S261-1
      - key: S261-4
        title: Add cross-worktree claim, briefing, and guard regressions proving claims coordinate and sprint context is not downgraded to adhoc (#665/#667)
        club: long_iron
        complexity: moderate
        github_issue: 665
        depends_on:
          - S261-1
          - S261-2
  - id: 262
    theme: Session and Sprint Status Truth
    par: 5
    slope: 3
    type: bugfix + operator trust
    depends_on:
      - 261
    note: "Fix #666/#663/#664: session records present stale branch and duplicate primary roles as current truth; sprint begin persists a ticket claim that sprint status does not show; sprint status ignores --help, --json, and unknown flags. Each slice carries the regression coverage needed to make the main status surface trustworthy before expanding coordination semantics."
    tickets:
      - key: S262-1
        title: Refresh session branch on heartbeat and status reads, or label stored branch as branch-at-start with regression coverage (#666)
        club: short_iron
        complexity: standard
        github_issue: 666
      - key: S262-2
        title: Stop reporting every concurrent session as an equally meaningful primary in collision messages (#666)
        club: short_iron
        complexity: standard
        github_issue: 666
        depends_on:
          - S262-1
      - key: S262-3
        title: Show active actor and ticket claims in slope sprint status after sprint begin with claim visibility tests (#663)
        club: short_iron
        complexity: standard
        github_issue: 663
      - key: S262-4
        title: Parse slope sprint status --help, reject unsupported flags, decide the --json contract, and cover Windows option parsing (#664)
        club: short_iron
        complexity: standard
        github_issue: 664
  - id: 263
    theme: Workflow Execution Scope Recovery
    par: 4
    slope: 3
    type: bugfix + guard reliability
    depends_on:
      - 261
    note: "Fix #668: workflow-step-gate can block a fresh sprint because an old execution for an already-merged sprint is still sitting at pre_shot. The guard should scope by active sprint and status, name the blocking execution when it must block, and close the lifecycle gap that leaves executions stale after scorecard/review validation."
    tickets:
      - key: S263-1
        title: Scope workflow-step-gate to the active sprint and ignore completed or merged sprint executions (#668)
        club: long_iron
        complexity: moderate
        github_issue: 668
      - key: S263-2
        title: Include blocking sprint id and execution id in workflow-step-gate error output (#668)
        club: wedge
        complexity: small
        github_issue: 668
        depends_on:
          - S263-1
      - key: S263-3
        title: Finalize or reconcile the current sprint execution when validation/review closes the sprint lifecycle (#668)
        club: short_iron
        complexity: standard
        github_issue: 668
        depends_on:
          - S263-1
  - id: 264
    theme: Multi-Agent Round Model
    par: 4
    slope: 3
    type: planning + product architecture
    depends_on:
      - 261
      - 262
      - 263
    note: "Resolve #669 as a product-model decision rather than letting implementation accidents define the handicap. Decide whether parallel agents are fourball, foursomes, scramble, or a SLOPE-specific hybrid; then turn that decision into scorecard, handicap, claim TTL, and distillation rules."
    tickets:
      - key: S264-1
        title: Decide the canonical multi-agent round format and document scorecard ownership semantics (#669)
        club: long_iron
        complexity: moderate
        github_issue: 669
      - key: S264-2
        title: Define agent, operator, repo, and team handicap attribution for parallel sprint work (#669)
        club: short_iron
        complexity: standard
        github_issue: 669
        depends_on:
          - S264-1
      - key: S264-3
        title: Specify claim TTL, abandoned-session handling, and cross-agent penalty attribution (#669)
        club: short_iron
        complexity: standard
        github_issue: 669
        depends_on:
          - S264-1
      - key: S264-4
        title: Specify merge-safe distillation for common-issues across concurrent agents (#669)
        club: wedge
        complexity: small
        github_issue: 669
        depends_on:
          - S264-1
scorecards:
  "260": docs/retros/sprint-260.json

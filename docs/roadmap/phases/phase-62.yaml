version: "1"
phase:
  name: Phase 62 — Parallel Agent Coordination Recovery
  description: "Triage of the late-July multi-agent and status-surface issue batch (#663, #664, #665, #666, #667, #668, #669), plus the linked-worktree post-merge evidence defect found during S262 (#673). The triage pass runs first so the roadmap records the open-issue ordering before implementation begins. A short inserted research sprint then translates lessons from block/buzz into SLOPE's roadmap without importing its transport or chat model. Worktree store split-brain leads implementation because it silently disables the coordination primitives and sprint guards in the path the collision guard mandates. Session/status truth comes next, then workflow execution and post-merge evidence scoping, then the formal SLOPE Team Round contract."
  sprints:
    - 260
    - 260.1
    - 261
    - 262
    - 263
    - 264
    - 264.1
    - 264.2
  status: in_progress
  note: "Issue-driven recovery for #663-#669 and #673. Ordered by blast radius: S260 records the triage, S260.1 captures Buzz-informed product and architecture lessons, #665/#667 make worktree sessions guard-blind and claim-blind, #666/#663/#664 make the status surface misleading for operators and agents, #668 gates fresh work on stale executions, #673 can strand post-merge evidence in a linked checkout, and #669 formalizes the Team Round model after the plumbing stops lying."
sprints:
  - id: 260
    status: complete
    theme: Late-July Issue Triage
    par: 3
    slope: 2
    type: planning + roadmap triage
    note: "Pull the latest upstream state, enumerate the open issue set, sort by blast radius and release risk, and commit the roadmap update before implementation starts."
    tickets:
      - key: S260-1
        title: Pull and rebuild latest main, then enumerate open GitHub issues #659 and #663-#669
        club: wedge
        complexity: small
      - key: S260-2
        title: Triage #665-#669 into ordered parallel-agent coordination recovery sprints
        club: short_iron
        complexity: standard
        depends_on:
          - S260-1
      - key: S260-3
        title: Isolate #659 into a 2.0 canonical sprint-id store migration track
        club: short_iron
        complexity: standard
        depends_on:
          - S260-1
      - key: S260-4
        title: Validate modular roadmap sources, compiled projection, codebase map, and S260 focus
        club: wedge
        complexity: small
        depends_on:
          - S260-2
          - S260-3
  - id: 260.1
    status: complete
    theme: Buzz Multiplayer Model Synthesis
    par: 4
    slope: 3
    type: research + product architecture
    depends_on:
      - 260
    note: "Inspect block/buzz as a collaboration reference, choose the SLOPE-native multiplayer model, and place the resulting identity, coordination, learning, status, and evaluation work into the delivery sequence. Preserve SLOPE's worktree and claim enforcement; do not adopt Nostr, crypto identity, or chat-first coordination as product dependencies."
    research:
      - docs/research/buzz-multiplayer-collaboration.md
    expected_artifacts:
      - docs/research/buzz-multiplayer-collaboration.md
      - docs/roadmap/phases/phase-64.yaml
    tickets:
      - key: S260.1-1
        title: Inspect block/buzz shared event log, agent pool, orchestration benchmark, and open collaboration gaps
        club: short_iron
        complexity: standard
      - key: S260.1-2
        title: Select the canonical SLOPE Team Round with one team outcome and actor-attributed shots
        club: long_iron
        complexity: moderate
        depends_on:
          - S260.1-1
      - key: S260.1-3
        title: Map identity, leases, callbacks, verification, learning, status, and evaluation into downstream sprints
        club: short_iron
        complexity: standard
        depends_on:
          - S260.1-1
          - S260.1-2
      - key: S260.1-4
        title: Compile and validate roadmap sources, projection, map, and focused sprint contexts
        club: wedge
        complexity: small
        depends_on:
          - S260.1-3
  - id: 261
    status: complete
    theme: Worktree Store Coordination
    par: 5
    slope: 5
    type: bugfix + multi-agent coordination
    depends_on:
      - 260.1
    note: "Fix #665/#667: the collision guard tells agents to enter a worktree, but a fresh worktree creates an isolated .slope store while MCP and parent sessions keep using the original store. That split-brain silently drops sprint-workflow guards, duplicates sprint state, and makes acquire_claim/check_conflicts return success with zero visible claims."
    tickets:
      - key: S261-1
        title: Resolve SLOPE state from the git common-dir owner so repo worktrees share one store (#665/#667)
        club: driver
        complexity: risky
        github_issue: 667
      - key: S261-2
        title: Make hook briefing, guard baselines, session state, and MCP tools agree on the same store path inside worktrees (#665)
        club: driver
        complexity: risky
        github_issue: 665
        depends_on:
          - S261-1
      - key: S261-3
        title: Warn or refuse when an in-repo child worktree would be globbed by parent tooling (#667)
        club: short_iron
        complexity: standard
        github_issue: 667
        depends_on:
          - S261-1
      - key: S261-4
        title: Add cross-worktree claim, briefing, and guard regressions proving claims coordinate and sprint context is not downgraded to adhoc (#665/#667)
        club: long_iron
        complexity: moderate
        github_issue: 665
        depends_on:
          - S261-1
          - S261-2
  - id: 262
    status: complete
    theme: Session and Sprint Status Truth
    par: 5
    slope: 3
    type: bugfix + operator trust
    depends_on:
      - 261
    note: "Fix #666/#663/#664 at the current presentation and operator-trust boundary. Session records present stale branch and duplicate primary labels as current truth; sprint begin persists a ticket claim that sprint status does not show; sprint status ignores --help, --json, and unknown flags. Durable actor, authority, and visibility semantics remain an S264 contract so S262 does not accidentally freeze a partial identity schema."
    tickets:
      - key: S262-1
        title: Refresh session branch on heartbeat and status reads, or label stored branch as branch-at-start with regression coverage (#666)
        club: short_iron
        complexity: standard
        github_issue: 666
      - key: S262-2
        title: Disambiguate concurrent sessions in collision messages without treating primary as durable identity or authority (#666)
        club: short_iron
        complexity: standard
        github_issue: 666
        depends_on:
          - S262-1
      - key: S262-3
        title: Show active actor and ticket claims in slope sprint status after sprint begin with claim visibility tests (#663)
        club: short_iron
        complexity: standard
        github_issue: 663
      - key: S262-4
        title: Parse slope sprint status --help, reject unsupported flags, decide the --json contract, and cover Windows option parsing (#664)
        club: short_iron
        complexity: standard
        github_issue: 664
  - id: 263
    status: complete
    theme: Workflow Execution Scope Recovery
    par: 4
    slope: 3
    type: bugfix + guard reliability
    depends_on:
      - 261
    note: "Fix #668 and #673: workflow-step-gate can block a fresh sprint because an old execution for an already-merged sprint is still sitting at pre_shot, while post-merge retro evidence can resolve relative to the invoking linked checkout instead of the repository state owner. Scope guards and evidence to authoritative active repository state, name the blocking execution when the guard must block, and close the lifecycle gap that leaves executions stale after scorecard/review validation."
    tickets:
      - key: S263-1
        title: Scope workflow-step-gate to the active sprint and ignore completed or merged sprint executions (#668)
        club: long_iron
        complexity: moderate
        github_issue: 668
      - key: S263-2
        title: Include blocking sprint id and execution id in workflow-step-gate error output (#668)
        club: wedge
        complexity: small
        github_issue: 668
        depends_on:
          - S263-1
      - key: S263-3
        title: Finalize or reconcile the current sprint execution when validation/review closes the sprint lifecycle (#668)
        club: short_iron
        complexity: standard
        github_issue: 668
        depends_on:
          - S263-1
      - key: S263-4
        title: Route post-merge retro evidence through the repository state owner with linked-worktree regression coverage (#673)
        club: wedge
        complexity: small
        github_issue: 673
        depends_on:
          - S263-3
  - id: 264
    theme: Team Round Domain and Scoring Contract
    par: 4
    slope: 4
    type: planning + product architecture
    depends_on:
      - 261
      - 262
      - 263
    note: "Resolve the domain and scoring half of #669 by formalizing a SLOPE Team Round: one sprint, one canonical score-versus-par outcome, and actor-attributed shots. Actor and role handicaps are risk-adjusted descriptive estimates, not causal rankings; coordination overhead remains a separate metric unless a versioned composite is introduced later. Define round identity, lifecycle, finalization, identity trust, shared-resource ownership, and compatibility before the coordination protocol is specified."
    research:
      - docs/research/buzz-multiplayer-collaboration.md
    expected_artifacts:
      - docs/architecture/team-round-domain.md
    tickets:
      - key: S264-1
        title: Define sprint key, round, attempt, scorecard version, lifecycle, exactly-once finalization, late events, and reopen policy (#669)
        club: long_iron
        complexity: moderate
        github_issue: 669
      - key: S264-2
        title: Define authenticated principal bindings for actor, session, role, contributors, verifier, authority, and visibility (#669)
        club: long_iron
        complexity: moderate
        github_issue: 669
        depends_on:
          - S264-1
      - key: S264-3
        title: Define accountable shot ownership, descriptive handicap estimands, difficulty and exposure adjustment, uncertainty, and penalty identity (#669)
        club: long_iron
        complexity: moderate
        github_issue: 669
        depends_on:
          - S264-1
          - S264-2
      - key: S264-4
        title: Define single-player compatibility, typed shared-resource ownership, and transport, crypto, chat-first, and prompt-only non-goals (#669)
        club: short_iron
        complexity: standard
        github_issue: 669
        depends_on:
          - S264-1
          - S264-2
  - id: 264.1
    theme: Coordination Integrity and Security Contract
    par: 4
    slope: 5
    type: planning + system architecture
    depends_on:
      - 264
    note: "Specify the durable protocol for #669 before implementation: evolve the existing event store rather than create a competing ledger, define the complete versioned identity/access envelope, require transactional append and deterministic replay, fence stale lease holders, and enforce deny-by-default capabilities and redaction in the store rather than in prompts."
    research:
      - docs/research/buzz-multiplayer-collaboration.md
    expected_artifacts:
      - docs/architecture/team-round-coordination.md
    tickets:
      - key: S264.1-1
        title: Define existing-event-store migration, source-of-truth authority, complete event envelope, scorecard projection, and deterministic replay (#669)
        club: driver
        complexity: risky
        github_issue: 669
      - key: S264.1-2
        title: Define idempotency scope and payload conflicts, atomic append and projection, ordering, schema evolution, and integrity checks (#669)
        club: long_iron
        complexity: moderate
        github_issue: 669
        depends_on:
          - S264.1-1
      - key: S264.1-3
        title: Define renewable leases with authoritative time, lease epochs, fencing, abandonment, retry, requeue, dead-letter, and escalation (#669)
        club: long_iron
        complexity: moderate
        github_issue: 669
        depends_on:
          - S264.1-1
      - key: S264.1-4
        title: Define deny-by-default capabilities, filtered views, redaction and retention, and adversarial enforcement criteria (#669)
        club: driver
        complexity: risky
        github_issue: 669
        depends_on:
          - S264.1-1
          - S264.1-2
  - id: 264.2
    theme: Collaboration Workflow and Evaluation Contract
    par: 4
    slope: 4
    type: planning + product architecture
    depends_on:
      - 264.1
    note: "Complete #669 with the human and agent operating contract: assignments require callbacks, verifier independence is principal-aware, concurrent learning is merge-safe, activity is semantic, and evaluation pins every material input while protecting secrets and treating coordination overhead as a separate measure."
    research:
      - docs/research/buzz-multiplayer-collaboration.md
    expected_artifacts:
      - docs/architecture/team-round-workflow.md
    tickets:
      - key: S264.2-1
        title: Define assignment and handoff states, success criteria, correlation, and mandatory completion or blocker callbacks (#669)
        club: short_iron
        complexity: standard
        github_issue: 669
      - key: S264.2-2
        title: Define principal-aware verifier independence and conflict rules for authors, contributors, delegators, sessions, and aliases (#669)
        club: long_iron
        complexity: moderate
        github_issue: 669
        depends_on:
          - S264.2-1
      - key: S264.2-3
        title: Define merge-safe learning and verb-object-outcome status with visible blocker, idle, stale, and timeout states (#669)
        club: short_iron
        complexity: standard
        github_issue: 669
      - key: S264.2-4
        title: Define reproducible and redacted multiplayer evaluation inputs, lifecycle policy, evidence, metrics, and reliability (#669)
        club: long_iron
        complexity: moderate
        github_issue: 669
        depends_on:
          - S264.2-2
          - S264.2-3

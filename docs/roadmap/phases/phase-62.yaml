version: "1"
phase:
  name: Phase 62 — Parallel Agent Coordination Recovery
  description: "Triage of the late-July multi-agent and status-surface issue batch (#663, #664, #665, #666, #667, #668, #669). The triage pass runs first so the roadmap records the open-issue ordering before implementation begins. A short inserted research sprint then translates lessons from block/buzz into SLOPE's roadmap without importing its transport or chat model. Worktree store split-brain leads implementation because it silently disables the coordination primitives and sprint guards in the path the collision guard mandates. Session/status truth comes next, then workflow execution scoping, then the formal SLOPE Team Round contract."
  sprints:
    - 260
    - 260.1
    - 261
    - 262
    - 263
    - 264
  status: in_progress
  note: "Issue-driven recovery for #663-#669. Ordered by blast radius: S260 records the triage, S260.1 captures Buzz-informed product and architecture lessons, #665/#667 make worktree sessions guard-blind and claim-blind, #666/#663/#664 make the status surface misleading for operators and agents, #668 gates fresh work on stale executions, and #669 formalizes the Team Round model after the plumbing stops lying."
sprints:
  - id: 260
    status: complete
    theme: Late-July Issue Triage
    par: 3
    slope: 2
    type: planning + roadmap triage
    note: "Pull the latest upstream state, enumerate the open issue set, sort by blast radius and release risk, and commit the roadmap update before implementation starts."
    tickets:
      - key: S260-1
        title: Pull and rebuild latest main, then enumerate open GitHub issues #659 and #663-#669
        club: wedge
        complexity: small
      - key: S260-2
        title: Triage #665-#669 into ordered parallel-agent coordination recovery sprints
        club: short_iron
        complexity: standard
        depends_on:
          - S260-1
      - key: S260-3
        title: Isolate #659 into a 2.0 canonical sprint-id store migration track
        club: short_iron
        complexity: standard
        depends_on:
          - S260-1
      - key: S260-4
        title: Validate modular roadmap sources, compiled projection, codebase map, and S260 focus
        club: wedge
        complexity: small
        depends_on:
          - S260-2
          - S260-3
  - id: 260.1
    theme: Buzz Multiplayer Model Synthesis
    par: 4
    slope: 3
    type: research + product architecture
    depends_on:
      - 260
    note: "Inspect block/buzz as a collaboration reference, choose the SLOPE-native multiplayer model, and place the resulting identity, coordination, learning, status, and evaluation work into the delivery sequence. Preserve SLOPE's worktree and claim enforcement; do not adopt Nostr, crypto identity, or chat-first coordination as product dependencies."
    research:
      - docs/research/buzz-multiplayer-collaboration.md
    expected_artifacts:
      - docs/research/buzz-multiplayer-collaboration.md
      - docs/roadmap/phases/phase-64.yaml
    tickets:
      - key: S260.1-1
        title: Inspect block/buzz shared event log, agent pool, orchestration benchmark, and open collaboration gaps
        club: short_iron
        complexity: standard
      - key: S260.1-2
        title: Select the canonical SLOPE Team Round with one team outcome and actor-attributed shots
        club: long_iron
        complexity: moderate
        depends_on:
          - S260.1-1
      - key: S260.1-3
        title: Map identity, leases, callbacks, verification, learning, status, and evaluation into downstream sprints
        club: short_iron
        complexity: standard
        depends_on:
          - S260.1-1
          - S260.1-2
      - key: S260.1-4
        title: Compile and validate roadmap sources, projection, map, and focused sprint contexts
        club: wedge
        complexity: small
        depends_on:
          - S260.1-3
  - id: 261
    theme: Worktree Store Coordination
    par: 5
    slope: 5
    type: bugfix + multi-agent coordination
    depends_on:
      - 260.1
    note: "Fix #665/#667: the collision guard tells agents to enter a worktree, but a fresh worktree creates an isolated .slope store while MCP and parent sessions keep using the original store. That split-brain silently drops sprint-workflow guards, duplicates sprint state, and makes acquire_claim/check_conflicts return success with zero visible claims."
    tickets:
      - key: S261-1
        title: Resolve SLOPE state from the git common-dir owner so repo worktrees share one store (#665/#667)
        club: driver
        complexity: risky
        github_issue: 667
      - key: S261-2
        title: Make hook briefing, guard baselines, session state, and MCP tools agree on the same store path inside worktrees (#665)
        club: driver
        complexity: risky
        github_issue: 665
        depends_on:
          - S261-1
      - key: S261-3
        title: Warn or refuse when an in-repo child worktree would be globbed by parent tooling (#667)
        club: short_iron
        complexity: standard
        github_issue: 667
        depends_on:
          - S261-1
      - key: S261-4
        title: Add cross-worktree claim, briefing, and guard regressions proving claims coordinate and sprint context is not downgraded to adhoc (#665/#667)
        club: long_iron
        complexity: moderate
        github_issue: 665
        depends_on:
          - S261-1
          - S261-2
  - id: 262
    theme: Actor, Session, and Sprint Status Truth
    par: 5
    slope: 3
    type: bugfix + operator trust
    depends_on:
      - 261
    note: "Fix #666/#663/#664 while establishing the identity boundaries S264 will formalize: stable actor identity, ephemeral session identity, functional role, control authority, and observer visibility are separate concepts. Session records currently present stale branch and duplicate primary roles as current truth; sprint begin persists a ticket claim that sprint status does not show; sprint status ignores --help, --json, and unknown flags."
    tickets:
      - key: S262-1
        title: Refresh session branch on heartbeat and status reads, or label stored branch as branch-at-start with regression coverage (#666)
        club: short_iron
        complexity: standard
        github_issue: 666
      - key: S262-2
        title: Replace duplicate primary labels with explicit actor, session, role, control-authority, and observer-visibility semantics (#666)
        club: long_iron
        complexity: moderate
        github_issue: 666
        depends_on:
          - S262-1
      - key: S262-3
        title: Show active actor and ticket claims in slope sprint status after sprint begin with claim visibility tests (#663)
        club: short_iron
        complexity: standard
        github_issue: 663
      - key: S262-4
        title: Parse slope sprint status --help, reject unsupported flags, decide the --json contract, and cover Windows option parsing (#664)
        club: short_iron
        complexity: standard
        github_issue: 664
  - id: 263
    theme: Workflow Execution Scope Recovery
    par: 4
    slope: 3
    type: bugfix + guard reliability
    depends_on:
      - 261
    note: "Fix #668: workflow-step-gate can block a fresh sprint because an old execution for an already-merged sprint is still sitting at pre_shot. The guard should scope by active sprint and status, name the blocking execution when it must block, and close the lifecycle gap that leaves executions stale after scorecard/review validation."
    tickets:
      - key: S263-1
        title: Scope workflow-step-gate to the active sprint and ignore completed or merged sprint executions (#668)
        club: long_iron
        complexity: moderate
        github_issue: 668
      - key: S263-2
        title: Include blocking sprint id and execution id in workflow-step-gate error output (#668)
        club: wedge
        complexity: small
        github_issue: 668
        depends_on:
          - S263-1
      - key: S263-3
        title: Finalize or reconcile the current sprint execution when validation/review closes the sprint lifecycle (#668)
        club: short_iron
        complexity: standard
        github_issue: 668
        depends_on:
          - S263-1
  - id: 264
    theme: Team Round and Collaboration Model
    par: 5
    slope: 5
    type: planning + product architecture
    depends_on:
      - 261
      - 262
      - 263
    note: "Resolve #669 by formalizing a SLOPE Team Round: one sprint, one authoritative team scorecard and outcome, and actor-attributed shots. This is neither fourball nor scramble; individual handicap derives from attributed shots while team handicap measures delivery plus coordination overhead. Specify the coordination ledger and collaboration contracts without making Nostr, crypto identity, chat, or prompt-only shared-filesystem conventions product dependencies."
    research:
      - docs/research/buzz-multiplayer-collaboration.md
    expected_artifacts:
      - docs/architecture/team-round.md
    tickets:
      - key: S264-1
        title: Specify one authoritative SLOPE Team Round scorecard with actor-attributed shots and single-player compatibility (#669)
        club: long_iron
        complexity: moderate
        github_issue: 669
      - key: S264-2
        title: Define actor, session, role, contributor, verifier, control-authority, and visibility identity fields (#669)
        club: long_iron
        complexity: moderate
        github_issue: 669
        depends_on:
          - S264-1
      - key: S264-3
        title: Define individual and team handicap derivation plus caused-by and resolved-by penalty attribution (#669)
        club: long_iron
        complexity: moderate
        github_issue: 669
        depends_on:
          - S264-1
          - S264-2
      - key: S264-4
        title: Specify an idempotent repo coordination event ledger and materialized status and scorecard views (#669)
        club: driver
        complexity: risky
        github_issue: 669
        depends_on:
          - S264-1
          - S264-2
      - key: S264-5
        title: Specify renewable claim leases, heartbeat and TTL, abandonment, requeue, retry, and escalation (#669)
        club: long_iron
        complexity: moderate
        github_issue: 669
        depends_on:
          - S264-4
      - key: S264-6
        title: Specify assignment callbacks, handoffs, and independent verification for risky work (#669)
        club: long_iron
        complexity: moderate
        github_issue: 669
        depends_on:
          - S264-4
      - key: S264-7
        title: Specify merge-safe learning, semantic team status, and reproducible multiplayer evaluation (#669)
        club: long_iron
        complexity: moderate
        github_issue: 669
        depends_on:
          - S264-3
          - S264-4
          - S264-5
          - S264-6
      - key: S264-8
        title: Record transport, crypto, chat-first, and prompt-only coordination non-goals (#669)
        club: wedge
        complexity: small
        github_issue: 669
        depends_on:
          - S264-1
scorecards:
  "260": docs/retros/sprint-260.json

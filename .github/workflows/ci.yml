name: CI

on:
  push:
    branches: [main]
  # Any base branch, not just main. Sequential sprints are reviewed as stacked
  # PRs (PR 2 targets PR 1's branch), and restricting to `main` meant those got
  # no CI at all until their predecessor merged and GitHub retargeted them —
  # exactly the PRs where a regression is easiest to miss (GH #645).
  pull_request:
    branches: ['**']

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: slope
          POSTGRES_DB: slope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
        env:
          SLOPE_TEST_PG_URL: postgresql://postgres:slope@localhost:5432/slope_test

      - name: Typecheck
        run: pnpm typecheck

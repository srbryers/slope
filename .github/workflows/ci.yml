name: CI

on:
  push:
    branches: [main]
  # Any base branch, not just main. Sequential sprints are reviewed as stacked
  # PRs (PR 2 targets PR 1's branch), and restricting to `main` meant those got
  # no CI at all until their predecessor merged and GitHub retargeted them —
  # exactly the PRs where a regression is easiest to miss (GH #645).
  pull_request:
    branches: ['**']

jobs:
  # One job, two legs, one per operating system. This used to be two jobs
  # (ci and ci-windows) running identical steps, which Tiaki's drift audit
  # rightly flagged as a duplicate. The legs differ in exactly the ways the
  # old jobs differed: the Mac leg runs the Postgres store tests, the
  # Windows leg does not, and the Windows leg reports without blocking
  # until #725 clears.
  ci:
    name: ci (${{ matrix.leg }})
    runs-on: ${{ matrix.runs_on }}
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Our own runner on the Mac Studio.
          - leg: macos
            runs_on: [self-hosted, slope]
            pg: true
            allow_failure: false
          # Our own runner on SRB-Desktop. Windows, because the path bugs
          # that only appear there were invisible to a Linux-only matrix.
          # git reports forward slashes on every platform while Node returns
          # backslashes, so a raw string comparison is always true on
          # Windows and always false-negative in CI. Five tests were broken
          # on main for an unknown stretch before anyone ran the suite
          # there (#712).
          - leg: windows
            runs_on: [self-hosted, Windows, X64, slope]
            pg: false
            allow_failure: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6

      # Mac runners get no GitHub service containers, so the Mac leg starts
      # its own throwaway Postgres from the Studio's Homebrew install and
      # throws it away with the runner temp dir. Trust auth is safe here:
      # the port is only reachable from this machine, for this run.
      # The Windows leg skips this: the PG store tests skip without
      # SLOPE_TEST_PG_URL, and the point of that leg is path and filesystem
      # behaviour, which the SQLite store already exercises.
      - name: Start throwaway Postgres (Mac leg)
        if: matrix.pg
        shell: bash
        run: |
          PGBIN=/opt/homebrew/opt/postgresql@17/bin
          # The runner service has no locale set, and Postgres on macOS
          # refuses to start without a valid one.
          export LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8
          export PGDATA="$RUNNER_TEMP/slope-pg"
          "$PGBIN/initdb" -D "$PGDATA" -U postgres --auth=trust > /dev/null
          "$PGBIN/pg_ctl" -D "$PGDATA" -o "-p 5433" -l "$RUNNER_TEMP/slope-pg.log" -w start > /dev/null
          "$PGBIN/createdb" -h localhost -p 5433 -U postgres slope_test

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test (with Postgres)
        if: matrix.pg
        run: pnpm test
        env:
          SLOPE_TEST_PG_URL: postgresql://postgres@localhost:5433/slope_test

      - name: Test (no Postgres)
        if: ${{ !matrix.pg }}
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

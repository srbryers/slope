name: CI

on:
  push:
    branches: [main]
  # Any base branch, not just main. Sequential sprints are reviewed as stacked
  # PRs (PR 2 targets PR 1's branch), and restricting to `main` meant those got
  # no CI at all until their predecessor merged and GitHub retargeted them —
  # exactly the PRs where a regression is easiest to miss (GH #645).
  pull_request:
    branches: ['**']

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: slope
          POSTGRES_DB: slope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
        env:
          SLOPE_TEST_PG_URL: postgresql://postgres:slope@localhost:5432/slope_test

      - name: Typecheck
        run: pnpm typecheck

  # Windows, because the path bugs that only appear there were invisible to a
  # Linux-only matrix. git reports forward slashes on every platform while Node
  # returns backslashes, so a raw string comparison is always true on Windows
  # and always false-negative in CI. Five tests were broken on main for an
  # unknown stretch before anyone ran the suite there (#712).
  #
  # No Postgres service: the PG store tests skip without SLOPE_TEST_PG_URL, and
  # the point of this job is path and filesystem behaviour, which the SQLite
  # store already exercises. Keeping it lean keeps it fast enough to stay on.
  ci-windows:
    runs-on: windows-latest
    # Reporting, not blocking, until the backlog it exposed is cleared. Its
    # first run found 17 failures; #712 fixed the five that were known plus a
    # real runtime bug, and 9 remain. Blocking now would stop every unrelated
    # PR on a cleanup nobody has scheduled. Tracked in #725 — flip this off
    # once that closes, because a green job nobody must satisfy decays.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck
